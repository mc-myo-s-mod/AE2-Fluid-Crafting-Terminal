plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

def enableFastSuite = providers.gradleProperty('enable_fastsuite').getOrElse('false').toBoolean()
def etRuntimeJar = providers.gradleProperty('etRuntimeJar').orNull
def etJeiAudit = providers.gradleProperty('etJeiAudit').getOrElse('false').toBoolean()
def reiAudit = providers.gradleProperty('reiAudit').getOrElse('false').toBoolean()
def ae2fctRootDir = projectDir.parentFile
def commonJavaSourceDir = new File(ae2fctRootDir, 'common/src/main/java')
def commonResourcesSourceDir = new File(ae2fctRootDir, 'common/src/main/resources')
def loaderResourceDirs = [file('src/main/resources'), file('src/generated/resources')]
def generatedCommonJavaDir = layout.buildDirectory.dir('generated/sources/ae2fctCommon/java')
def generatedCommonResourcesDir = layout.buildDirectory.dir('generated/resources/ae2fctCommon')

def syncAE2FCTCommonJava = tasks.register('syncAE2FCTCommonJava', Sync) {
    from commonJavaSourceDir
    into generatedCommonJavaDir
}

def syncAE2FCTCommonResources = tasks.register('syncAE2FCTCommonResources', Sync) {
    from commonResourcesSourceDir
    into generatedCommonResourcesDir
    inputs.files(loaderResourceDirs.collect { fileTree(it) })
            .withPropertyName('loaderResourceOverrides').withPathSensitivity(PathSensitivity.RELATIVE)
    exclude { details ->
        !details.directory && loaderResourceDirs.any { new File(it, details.relativePath.pathString).isFile() }
    }
}

repositories {
    mavenCentral()
    maven {
        url = "https://maven.shadowsoffire.dev/releases"
        content { includeGroup "dev.shadowsoffire" }
    }
    //jei
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    //rei
    maven {
        url = "https://maven.shedaniel.me"
    }
    //ae2 and GuideME
    maven {
        url = "https://modmaven.dev"
        content {
            includeGroup "appeng"
            includeGroup "de.mari_023"
        }
    }
}

base {
    archivesName = "AE2-Fluid-Crafting-Terminal-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version.toString()))

sourceSets {
    main {
        java.srcDir files(generatedCommonJavaDir).builtBy(syncAE2FCTCommonJava)
        resources.srcDir files(generatedCommonResourcesDir).builtBy(syncAE2FCTCommonResources)
    }

    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.named('compileJava').configure {
    dependsOn syncAE2FCTCommonJava
}

tasks.named('processResources').configure {
    dependsOn syncAE2FCTCommonResources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.matching { it.name in ['neoForgeIdeSync', 'idea', 'ideaModule'] }.configureEach {
    dependsOn syncAE2FCTCommonJava
    dependsOn syncAE2FCTCommonResources
}

idea {
    module {
        sourceDirs += generatedCommonJavaDir.get().asFile
        generatedSourceDirs += generatedCommonJavaDir.get().asFile
        resourceDirs += generatedCommonResourcesDir.get().asFile
    }
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    if (project.hasProperty('parchment_mappings_version') && project.hasProperty('parchment_minecraft_version')) {
        parchment {
            mappingsVersion = project.parchment_mappings_version
            minecraftVersion = project.parchment_minecraft_version
        }
    }

    addModdingDependenciesTo sourceSets.gameTest

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        ae2fct_gametest {
            sourceSet(sourceSets.gameTest)
        }
    }

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

            systemProperty("guideme.ae2.guide.sources", "${file("src/main/resources").absolutePath}/assets/${mod_id}/ae2guide")
            systemProperty("guideme.ae2.guide.sourcesNamespace", mod_id)

        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            loadedMods = [mods.ae2fct, mods.ae2fct_gametest]
            sourceSet = sourceSets.gameTest
            if (enableFastSuite) {
                // Placebo's player sync cannot run against the mock connections in Myotus' own tests.
                programArguments.addAll '--tests', "${mod_id}:*"
            }
        }

        renderTestClient {
            client()
            loadedMods = [mods.ae2fct, mods.ae2fct_gametest]
            sourceSet = sourceSets.gameTest
            systemProperty 'ae2fct.etJeiAudit', etJeiAudit.toString()
            systemProperty 'ae2fct.reiAudit', reiAudit.toString()
        }

        data {
            serverData()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath(),
                    '--existing', new File(ae2fctRootDir, 'common/src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            if (name != 'gameTestServer' && name != 'renderTestClient') {
                loadedMods = [mods.ae2fct]
            }

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    implementation "org.appliedenergistics:appliedenergistics2:${AE2_version}"
    implementation "me.myogoo:myotus:${Myotus_version}"

    compileOnly "org.appliedenergistics:guideme:${guideme_version}:api"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${JEI_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${REI_version}"
    runtimeOnly "org.appliedenergistics:guideme:${guideme_version}"
    if (etRuntimeJar) {
        runtimeOnly files(etRuntimeJar)
    }

    gameTestCompileOnly "dev.shadowsoffire:FastSuite:26.1.2-7.0.0"
    if (enableFastSuite) {
        gameTestRuntimeOnly "dev.shadowsoffire:FastSuite:26.1.2-7.0.0"
        gameTestRuntimeOnly "dev.shadowsoffire:Placebo:26.1.2-10.0.2"
    }

    switch (project.itemListMod) {
        case "jei":
            runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${JEI_version}"
            break
        case "rei":
            runtimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${REI_version}"
            break
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description,
                             Myotus_version         : Myotus_version,
                             AE2_version_range      : AE2_version_range,
                             JEI_version_range      : JEI_version_range]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
