pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'AE2FluidCraftingTerminal'

include 'common'
include 'forge-1-20-1'
include 'neoforge-1-21-1'
include 'neoforge-26-1-2'

// ForgeGradle stays on Gradle 8; 26.1.2 uses its native Gradle 9 wrapper.
project(':neoforge-26-1-2').buildFileName = 'root.gradle'
