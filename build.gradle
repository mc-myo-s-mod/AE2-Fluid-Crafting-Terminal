plugins {
    id 'base'
    id 'idea'
}

def loadProjectProperties = { Project target ->
    def propertiesFile = target.file('gradle.properties')
    if (!propertiesFile.isFile()) {
        return
    }

    def properties = new Properties()
    propertiesFile.withInputStream { properties.load(it) }
    properties.each { key, value ->
        def propertyName = key.toString()
        if (!target.hasProperty(propertyName)) {
            target.extensions.extraProperties.set(propertyName, value)
        }
    }
}

allprojects {
    loadProjectProperties(project)

    group = findProperty('mod_group_id') ?: 'me.myogoo'
    version = findProperty('mod_version') ?: 'unspecified'

    repositories {
        mavenCentral()
        maven {
            name = 'ModMaven'
            url = 'https://modmaven.dev'
            content {
                includeGroup 'appeng'
                includeGroup 'de.mari_023'
            }
        }
        maven {
            name = 'CurseMaven'
            url = 'https://cursemaven.com'
        }
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
        }
        maven {
            name = "Jared's maven"
            url = 'https://maven.blamejared.com/'
        }
        maven {
            name = 'TerraformersMC'
            url = 'https://maven.terraformersmc.com/'
        }
        maven {
            name = 'Shedaniel'
            url = 'https://maven.shedaniel.me/'
        }
        maven {
            name = 'Shadows'
            url = 'https://maven.shadowsoffire.dev/releases'
            content {
                includeGroup 'dev.shadowsoffire'
            }
        }
    }
}

def modProjects = [project(':forge-1-20-1'), project(':neoforge-1-21-1')]

configure([project(':common')] + modProjects) {
    apply plugin: 'java'
    apply plugin: 'idea'

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    tasks.withType(Javadoc).configureEach {
        failOnError = false
        options.encoding = 'UTF-8'
        options.addStringOption('charSet', 'UTF-8')
        options.addStringOption('docEncoding', 'UTF-8')
        options.addStringOption('Xdoclint:none', '-quiet')
    }

    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }
}

configure(project(':common')) {
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
    }
}

configure(modProjects) {
    def commonJavaSourceDir = rootProject.layout.projectDirectory.dir('common/src/main/java').asFile
    def commonResourcesSourceDir = rootProject.layout.projectDirectory.dir('common/src/main/resources').asFile
    def loaderResourceDirs = [file('src/main/resources'), file('src/generated/resources')]
    def generatedCommonJavaDir = layout.buildDirectory.dir('generated/sources/ae2fctCommon/java')
    def generatedCommonResourcesDir = layout.buildDirectory.dir('generated/resources/ae2fctCommon')

    def syncAE2FCTCommonJava = tasks.register('syncAE2FCTCommonJava', Sync) {
        from commonJavaSourceDir
        into generatedCommonJavaDir
    }

    def syncAE2FCTCommonResources = tasks.register('syncAE2FCTCommonResources', Sync) {
        from commonResourcesSourceDir
        into generatedCommonResourcesDir
        inputs.files(loaderResourceDirs.collect { fileTree(it) })
                .withPropertyName('loaderResourceOverrides').withPathSensitivity(PathSensitivity.RELATIVE)
        exclude { details ->
            !details.directory && loaderResourceDirs.any { new File(it, details.relativePath.pathString).isFile() }
        }
    }

    def generatedCommonJavaSources = files(generatedCommonJavaDir).builtBy(syncAE2FCTCommonJava)
    def generatedCommonResources = files(generatedCommonResourcesDir).builtBy(syncAE2FCTCommonResources)

    base {
        archivesName = "${project.mod_name}-${project.minecraft_version}"
    }

    sourceSets {
        main {
            java.srcDir generatedCommonJavaSources
            resources.srcDir generatedCommonResources
            resources.srcDir 'src/generated/resources'
        }
    }

    tasks.named('compileJava').configure {
        dependsOn syncAE2FCTCommonJava
    }

    tasks.named('processResources').configure {
        dependsOn syncAE2FCTCommonResources
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    tasks.matching { it.name in ['genIntellijRuns', 'neoForgeIdeSync', 'idea', 'ideaModule'] }.configureEach {
        dependsOn syncAE2FCTCommonJava
        dependsOn syncAE2FCTCommonResources
    }

    idea {
        module {
            sourceDirs += generatedCommonJavaDir.get().asFile
            generatedSourceDirs += generatedCommonJavaDir.get().asFile
            resourceDirs += generatedCommonResourcesDir.get().asFile
        }
    }

    tasks.named('jar', Jar).configure {
        manifest {
            attributes(['Specification-Title'     : mod_id,
                        'Specification-Vendor'    : mod_authors,
                        'Specification-Version'   : '1',
                        'Implementation-Title'    : project.name,
                        'Implementation-Version'  : project.version.toString(),
                        'Implementation-Vendor'   : mod_authors,
                        'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
        }
    }
}

tasks.named('build') {
    dependsOn ':common:build', ':forge-1-20-1:build', ':neoforge-1-21-1:build', ':neoforge-26-1-2:build'
}

tasks.register('syncIntellij') {
    group = 'ide'
    description = 'Prepares IntelliJ metadata and run configurations for all AE2FCT modules.'
    dependsOn ':forge-1-20-1:genIntellijRuns'
    dependsOn ':neoforge-1-21-1:neoForgeIdeSync'
    dependsOn ':neoforge-26-1-2:neoForgeIdeSync'
}
