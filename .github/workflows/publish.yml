name: 'Publish to Modrinth & CurseForge'

on:
  pull_request:
    types: [closed]
    branches:
      - '1.20.1'
      - '1.21.1'
    paths:
      - 'CHANGELOG.md'
jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read Variables from gradle.properties
        id: vars
        run: |
          java_version=$(grep '^java_version=' gradle.properties | cut -d'=' -f2 | tr -d ' \r')
          echo "java_version=$java_version" >> $GITHUB_OUTPUT
          mc_version=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2 | tr -d ' \r')
          echo "mc_version=$mc_version" >> $GITHUB_OUTPUT
          mod_version=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d ' \r')
          echo "mod_version=$mod_version" >> $GITHUB_OUTPUT
          mod_loader=$(grep '^mod_loader=' gradle.properties | cut -d'=' -f2 | tr -d ' \r')
          echo "mod_loader=$mod_loader" >> $GITHUB_OUTPUT
          version_type=$(grep '^mod_version_type=' gradle.properties | cut -d'=' -f2 | tr -d ' \r')
          echo "version_type=$version_type" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: ${{ steps.vars.outputs.java_version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Publish to Modrinth & CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ZDerLllZ
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1476701
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          changelog-file: 'CHANGELOG.md' 
          game-versions: ${{ steps.vars.outputs.mc_version }}
          loaders: ${{ steps.vars.outputs.mod_loader }}
          environment: client | server
          version-type: ${{ steps.vars.outputs.version_type }}

          files: 'build/libs/!(*-@(all|dev|sources|javadoc)).jar'
          name: AE2-Fluid-Crafting-Terminal-${{ steps.vars.outputs.mc_version }}-${{ steps.vars.outputs.mod_version }}
          version: ${{ steps.vars.outputs.mc_version }}-${{ steps.vars.outputs.mod_version }}

          dependencies: |
            ae2(required){modrinth:XxWD5pD3}{curseforge:223794}
            myotus(required){modrinth:32YA23Pp}{curseforge:1496024}
