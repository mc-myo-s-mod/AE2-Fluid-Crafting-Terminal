name: Publish AE2 Fluid Crafting Terminal Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      jar: ${{ steps.metadata.outputs.jar }}
      java_version: ${{ steps.metadata.outputs.java_version }}
      mc_version: ${{ steps.metadata.outputs.mc_version }}
      mod_loader: ${{ steps.metadata.outputs.mod_loader }}
      mod_version: ${{ steps.metadata.outputs.mod_version }}
      version_type: ${{ steps.metadata.outputs.version_type }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Verify release tag is on master
        env:
          RELEASE_BRANCH: master
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
          release_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          test "$(git rev-parse HEAD)" = "$release_sha"
          if ! git merge-base --is-ancestor "$release_sha" "refs/remotes/origin/${RELEASE_BRANCH}"; then
            echo "::error::Release tag '$RELEASE_TAG' is not on branch '$RELEASE_BRANCH'."
            exit 1
          fi
      - name: Select and validate release module
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          case "$release_version" in
            1.20.1-*) module=forge-1-20-1 ;;
            1.21.1-*) module=neoforge-1-21-1 ;;
            26.1.2-*) module=neoforge-26-1-2 ;;
            *) echo "::error::Unsupported release tag '$RELEASE_TAG'."; exit 1 ;;
          esac
          read_property() {
            sed -n "s/^$1=//p" "$module/gradle.properties" | tr -d '\r' | tail -n 1
          }
          mc_version="$(read_property minecraft_version)"
          mod_version="$(read_property mod_version)"
          mod_loader="$(read_property mod_loader)"
          java_version="$(read_property java_version)"
          version_type="$(read_property mod_version_type)"
          myotus_version="$(read_property Myotus_version)"
          for property in mc_version mod_version mod_loader java_version version_type myotus_version; do
            if [[ -z "${!property}" ]]; then
              echo "::error::Missing $property in $module/gradle.properties."
              exit 1
            fi
          done
          if [[ "$mod_version" == *-SNAPSHOT || "$myotus_version" == *-SNAPSHOT ]]; then
            echo "::error::Release builds require non-SNAPSHOT mod and Myotus versions."
            exit 1
          fi
          if [[ "$release_version" != "${mc_version}-${mod_version}" ]]; then
            echo "::error::Expected v${mc_version}-${mod_version}, got $RELEASE_TAG."
            exit 1
          fi
          if [[ "$IS_PRERELEASE" == true && "$version_type" == release ]]; then
            version_type=beta
          fi
          wrapper=./gradlew
          project=.
          prefix=":${module}:"
          toolchains=$'17\n21'
          if [[ "$module" == neoforge-26-1-2 ]]; then
            wrapper="./$module/gradlew"
            project="$module"
            prefix=""
            toolchains=25
          fi
          artifact_name="AE2-Fluid-Crafting-Terminal-${mc_version}-${mod_version}"
          artifact_path="$module/build/libs/$artifact_name.jar"
          {
            echo "module=$module"
            echo "artifact_name=$artifact_name"
            echo "artifact_path=$artifact_path"
            echo "jar=$artifact_name.jar"
            echo "mc_version=$mc_version"
            echo "mod_version=$mod_version"
            echo "mod_loader=$mod_loader"
            echo "java_version=$java_version"
            echo "version_type=$version_type"
            echo "wrapper=$wrapper"
            echo "project=$project"
            echo "prefix=$prefix"
            echo "toolchains<<EOF"
            echo "$toolchains"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare release notes
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
          MODULE: ${{ steps.metadata.outputs.module }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ -n "${RELEASE_BODY//[[:space:]]/}" ]]; then
            printf '%s\n' "$RELEASE_BODY" > dist/release-notes.md
          else
            test -s "$MODULE/CHANGELOG.md"
            cp "$MODULE/CHANGELOG.md" dist/release-notes.md
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.metadata.outputs.toolchains }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false
      - name: Build selected module
        env:
          WRAPPER: ${{ steps.metadata.outputs.wrapper }}
          PROJECT: ${{ steps.metadata.outputs.project }}
          PREFIX: ${{ steps.metadata.outputs.prefix }}
        run: |
          chmod +x "$WRAPPER"
          "$WRAPPER" --project-dir "$PROJECT" \
            "${PREFIX}compileJava" "${PREFIX}runData" \
            "${PREFIX}runGameTestServer" "${PREFIX}build" \
            -Penable_et=false --build-cache --no-configuration-cache --no-daemon --console=plain
      - name: Collect release artifact
        env:
          ARTIFACT_PATH: ${{ steps.metadata.outputs.artifact_path }}
          JAR: ${{ steps.metadata.outputs.jar }}
        run: |
          set -euo pipefail
          test -f "$ARTIFACT_PATH"
          cp "$ARTIFACT_PATH" "dist/$JAR"
      - uses: actions/upload-artifact@v7
        with:
          name: release-jars
          path: dist/
          if-no-files-found: error
          retention-days: 7

  attach-github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-jars
          path: dist
      - name: Attach artifact to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          JAR: ${{ needs.build.outputs.jar }}
        run: gh release upload "$RELEASE_TAG" "dist/$JAR" --clobber

  publish-platforms:
    needs: [build, attach-github-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-jars
          path: dist
      - name: Verify release payload
        env:
          JAR: ${{ needs.build.outputs.jar }}
        run: |
          test -f "dist/$JAR"
          test -s dist/release-notes.md
      - name: Publish to Modrinth and CurseForge
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          modrinth-id: ZDerLllZ
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: ${{ needs.build.outputs.version_type == 'release' }}
          curseforge-id: 1476701
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          name: ${{ needs.build.outputs.artifact_name }}
          version: ${{ needs.build.outputs.mc_version }}-${{ needs.build.outputs.mod_version }}
          version-type: ${{ needs.build.outputs.version_type }}
          changelog-file: dist/release-notes.md
          files: dist/${{ needs.build.outputs.jar }}
          game-versions: ${{ needs.build.outputs.mc_version }}
          loaders: ${{ needs.build.outputs.mod_loader }}
          environment: "client | server"
          java: ${{ needs.build.outputs.java_version }}
          retry-attempts: 2
          retry-delay: 10000
          fail-mode: fail
          modrinth-dependencies: |
            XxWD5pD3(required)
            32YA23Pp(required)
          curseforge-dependencies: |
            223794(required)
            1496024(required)
