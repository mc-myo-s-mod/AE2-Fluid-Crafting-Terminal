name: Publish AE2 Fluid Crafting Terminal Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifact
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      jar: ${{ steps.metadata.outputs.jar }}
      java_version: ${{ steps.metadata.outputs.java_version }}
      mc_version: ${{ steps.metadata.outputs.mc_version }}
      mod_loader: ${{ steps.metadata.outputs.mod_loader }}
      mod_version: ${{ steps.metadata.outputs.mod_version }}
      version_type: ${{ steps.metadata.outputs.version_type }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Read and validate release metadata
        id: metadata
        shell: bash
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          read_property() {
            local property_name="$1"
            sed -n "s/^${property_name}=//p" gradle.properties | tr -d '\r' | tail -n 1
          }

          mc_version="$(read_property minecraft_version)"
          mod_version="$(read_property mod_version)"
          mod_loader="$(read_property mod_loader)"
          version_type="$(read_property mod_version_type)"
          java_version="$(read_property java_version)"
          myotus_version="$(read_property Myotus_version)"

          for value_name in mc_version mod_version mod_loader version_type java_version myotus_version; do
            if [[ -z "${!value_name}" ]]; then
              echo "::error::Missing ${value_name} in gradle.properties."
              exit 1
            fi
          done

          release_version="${RELEASE_TAG#v}"
          expected_version="${mc_version}-${mod_version}"

          if [[ "$mod_version" == *-SNAPSHOT ]]; then
            echo "::error::Release builds require a non-SNAPSHOT mod_version, found '${mod_version}'."
            exit 1
          fi

          if [[ "$myotus_version" == *-SNAPSHOT ]]; then
            echo "::error::Release builds require a non-SNAPSHOT Myotus_version, found '${myotus_version}'."
            exit 1
          fi

          if [[ "$release_version" != "$expected_version" ]]; then
            echo "::error::Release tag '${RELEASE_TAG}' must be '${expected_version}', optionally prefixed with 'v'."
            exit 1
          fi

          if [[ "$IS_PRERELEASE" == "true" && "$version_type" == "release" ]]; then
            version_type="beta"
          fi

          artifact_name="AE2-Fluid-Crafting-Terminal-${mc_version}-${mod_version}"

          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
          echo "jar=${artifact_name}.jar" >> "$GITHUB_OUTPUT"
          echo "java_version=${java_version}" >> "$GITHUB_OUTPUT"
          echo "mc_version=${mc_version}" >> "$GITHUB_OUTPUT"
          echo "mod_loader=${mod_loader}" >> "$GITHUB_OUTPUT"
          echo "mod_version=${mod_version}" >> "$GITHUB_OUTPUT"
          echo "release_branch=${mc_version}" >> "$GITHUB_OUTPUT"
          echo "version_type=${version_type}" >> "$GITHUB_OUTPUT"

      - name: Verify tag belongs to its Minecraft release branch
        env:
          RELEASE_BRANCH: ${{ steps.metadata.outputs.release_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"

          source_sha="$(git rev-parse HEAD)"
          release_sha="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"

          if [[ "$source_sha" != "$release_sha" ]]; then
            echo "::error::Checked-out source does not match release tag '${RELEASE_TAG}'."
            exit 1
          fi

          if ! git merge-base --is-ancestor \
            "$release_sha" "refs/remotes/origin/${RELEASE_BRANCH}"
          then
            echo "::error::Release tag '${RELEASE_TAG}' is not on branch '${RELEASE_BRANCH}'."
            exit 1
          fi

      - name: Prepare release notes
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          mkdir -p dist

          if [[ -n "${RELEASE_BODY//[[:space:]]/}" ]]; then
            printf '%s\n' "$RELEASE_BODY" > dist/release-notes.md
          elif [[ -s CHANGELOG.md ]]; then
            cp CHANGELOG.md dist/release-notes.md
          else
            echo "::error::The GitHub Release body and CHANGELOG.md are both empty."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: ${{ steps.metadata.outputs.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Generate data
        run: |
          ./gradlew runData \
            --build-cache \
            --no-daemon \
            --console=plain

      - name: Build release artifact
        run: |
          ./gradlew build \
            --build-cache \
            --no-daemon \
            --console=plain

      - name: Collect release artifact
        env:
          JAR: ${{ steps.metadata.outputs.jar }}
        run: |
          set -euo pipefail
          artifact_path="build/libs/${JAR}"
          test -f "$artifact_path"
          cp "$artifact_path" "dist/${JAR}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-jars
          path: dist/
          if-no-files-found: error
          retention-days: 7

  attach-github-release:
    name: Attach jar to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-jars
          path: dist

      - name: Upload jar to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JAR: ${{ needs.build.outputs.jar }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "dist/${JAR}" \
            --clobber

  publish-platforms:
    name: Publish to Modrinth and CurseForge
    needs:
      - build
      - attach-github-release
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-jars
          path: dist

      - name: Verify release payload
        env:
          JAR: ${{ needs.build.outputs.jar }}
        run: |
          set -euo pipefail
          test -f "dist/${JAR}"
          test -s dist/release-notes.md

      - name: Publish to Modrinth and CurseForge
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          modrinth-id: ZDerLllZ
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: ${{ needs.build.outputs.version_type == 'release' }}

          curseforge-id: 1476701
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          name: ${{ needs.build.outputs.artifact_name }}
          version: ${{ needs.build.outputs.mc_version }}-${{ needs.build.outputs.mod_version }}
          version-type: ${{ needs.build.outputs.version_type }}
          changelog-file: dist/release-notes.md
          files: dist/${{ needs.build.outputs.jar }}
          game-versions: ${{ needs.build.outputs.mc_version }}
          loaders: ${{ needs.build.outputs.mod_loader }}
          environment: "client | server"
          java: ${{ needs.build.outputs.java_version }}
          retry-attempts: 2
          retry-delay: 10000
          fail-mode: fail

          dependencies: |
            ae2(required){modrinth:XxWD5pD3}{curseforge:223794}
            myotus(required){modrinth:32YA23Pp}{curseforge:1496024}
